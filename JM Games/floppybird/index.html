<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Floppy Bird 🐤</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%; width:100%; overflow:hidden; position:fixed;
    background:#0b1a24;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas{display:block; position:fixed; inset:0; z-index:1;}

  .overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center;
  }
  .overlay.hidden{display:none;}

  /* ================= HOME ================= */
  .title{
    font-size: clamp(34px, 9vw, 64px);
    font-weight: 900; letter-spacing: 3px; color:#fff;
    text-shadow: 0 4px 0 #2f6b1c, 0 8px 0 rgba(0,0,0,.18), 0 14px 26px rgba(0,0,0,.35);
    -webkit-text-stroke: 2px #2f6b1c;
    line-height:1.05;
  }
  .title span{ color:#ffd83d; -webkit-text-stroke: 2px #8a5a00; }

  .sub{
    font-size: clamp(13px, 3.6vw, 17px);
    font-weight: 700; color:#0d3b4d;
    background: rgba(255,255,255,.72);
    padding: 7px 18px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }

  .btn{
    font: 900 clamp(16px,4.4vw,21px)/1 system-ui, sans-serif;
    letter-spacing: 1.5px; color:#fff;
    background: linear-gradient(180deg,#8ee06a,#4a9e2c);
    border: 3px solid #2f6b1c; border-radius: 999px;
    padding: 16px 46px; cursor:pointer;
    box-shadow: 0 7px 0 #2f6b1c, 0 14px 28px rgba(0,0,0,.28);
    text-shadow: 0 2px 0 rgba(0,0,0,.28);
    transition: transform .07s ease, box-shadow .07s ease;
    white-space: nowrap;
  }
  .btn:active{ transform: translateY(5px); box-shadow: 0 2px 0 #2f6b1c, 0 6px 16px rgba(0,0,0,.3); }

  .btn.ghost{
    background: linear-gradient(180deg,#dfe7f0,#a3b2c4);
    border-color:#5f6b7a;
    box-shadow: 0 7px 0 #5f6b7a, 0 14px 28px rgba(0,0,0,.25);
    color:#243040; text-shadow: 0 2px 0 rgba(255,255,255,.5);
    padding: 13px 34px; font-size: clamp(13px,3.6vw,16px);
  }
  .btn.ghost:active{ box-shadow: 0 2px 0 #5f6b7a, 0 6px 16px rgba(0,0,0,.3); }

  /* medium (orange) */
  .modeBtn[data-mode="medium"]{
    background: linear-gradient(180deg,#ffb84d,#e07800);
    border-color:#a85a00;
    box-shadow: 0 7px 0 #a85a00, 0 14px 28px rgba(0,0,0,.28);
    color:#3d2100;
    text-shadow: 0 2px 0 rgba(255,255,255,.35);
  }
  .modeBtn[data-mode="medium"]:active{ box-shadow: 0 2px 0 #a85a00, 0 6px 16px rgba(0,0,0,.3); }

  /* hard (red) */
  .modeBtn[data-mode="hard"]{
    background: linear-gradient(180deg,#ff6b5e,#c72a1a);
    border-color:#8f1e10;
    box-shadow: 0 7px 0 #8f1e10, 0 14px 28px rgba(0,0,0,.28);
  }
  .modeBtn[data-mode="hard"]:active{ box-shadow: 0 2px 0 #8f1e10, 0 6px 16px rgba(0,0,0,.3); }

  /* orange helper */
  .btn.orange{
    background: linear-gradient(180deg,#ffb84d,#e07800);
    border-color:#a85a00;
    box-shadow: 0 7px 0 #a85a00, 0 14px 28px rgba(0,0,0,.28);
    color:#3d2100;
    text-shadow: 0 2px 0 rgba(255,255,255,.35);
    padding: 13px 34px;
    font-size: clamp(14px,3.8vw,17px);
  }
  .btn.orange:active{ box-shadow: 0 2px 0 #a85a00, 0 6px 16px rgba(0,0,0,.3); }

  .bestLine{
    font-size: clamp(13px,3.6vw,16px);
    font-weight: 800; color:#fff;
    background: rgba(0,0,0,.30);
    padding: 8px 20px; border-radius: 999px;
    letter-spacing:.5px;
  }
  .bestLine b{ color:#ffd83d; }

  .hint{
    font-size: clamp(11px,3.2vw,13px);
    font-weight: 700; color:#0d3b4d;
    opacity:.78; letter-spacing:.5px;
  }

  /* ================= MODE SELECT ================= */
  #modeSelect{
    background: rgba(4,20,30,.18);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #modeSelect .btn{ min-width: min(72vw, 260px); }

  /* ================= TAP TO PLAY ================= */
  #ready{
    justify-content: flex-start;
    padding-top: 22vh;
    pointer-events: none;
  }
  #ready .tapText{
    font-size: clamp(26px, 7.5vw, 44px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #ffffff;
    -webkit-text-stroke: 1px rgba(0,0,0,.10);
    animation: slowGlow 3.8s ease-in-out infinite;
    will-change: opacity, text-shadow;
  }
  @keyframes slowGlow{
    0%, 100%{
      opacity: 1;
      text-shadow:
        0 0 12px rgba(255,255,255,.75),
        0 0 26px rgba(255,255,255,.40),
        0 0 52px rgba(255,255,255,.18);
    }
    50%{
      opacity: .62;
      text-shadow:
        0 0 6px  rgba(255,255,255,.35),
        0 0 14px rgba(255,255,255,.16),
        0 0 26px rgba(255,255,255,.06);
    }
  }
  #ready .readySub{
    margin-top: 16px;
    font-size: clamp(12px,3.4vw,15px);
    font-weight: 800;
    letter-spacing: 3px;
    color: rgba(255,255,255,.78);
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  /* ================= GAME OVER ================= */
  #over{ background: rgba(4,20,30,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card{
    background: linear-gradient(180deg,#ffffff,#eef6fb);
    border-radius: 28px;
    padding: 22px 24px 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.4), inset 0 -6px 0 rgba(0,0,0,.06);
    border: 4px solid #fff;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    min-width: min(86vw, 330px);
    animation: pop .32s cubic-bezier(.2,1.5,.5,1);
  }
  @keyframes pop{ from{ transform: scale(.75); opacity:0; } to{ transform: scale(1); opacity:1; } }

  .card h2{
    font-size: clamp(24px,7vw,32px);
    font-weight: 900; letter-spacing:1px;
    color:#e05a2b;
    text-shadow: 0 3px 0 rgba(0,0,0,.12);
    -webkit-text-stroke: 1px #b03f17;
  }
  .scores{ display:flex; gap:12px; width:100%; }
  .scoreBox{
    flex:1; background:#f2f8fc; border-radius:16px; padding:10px 6px;
    border:2px solid #dbe9f2; display:flex; flex-direction:column; gap:2px;
  }
  .scoreBox span{ font-size:11px; font-weight:800; letter-spacing:1.2px; color:#7d95a6; text-transform:uppercase; }
  .scoreBox b{ font-size: clamp(22px,6.4vw,28px); font-weight:900; color:#12384d; }
  .scoreBox.gold{ background:linear-gradient(180deg,#fff8d6,#ffeeb0); border-color:#f2d27a; }
  .scoreBox.gold b{ color:#a87400; }

  .goldRow{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; gap:10px;
    background: linear-gradient(180deg,#fff8d6,#ffeeb0);
    border:2px solid #f2d27a;
    border-radius:14px;
    padding: 9px 16px;
    font-weight: 800;
    color: #7a5200;
    font-size: clamp(12px,3.4vw,14px);
    letter-spacing: .4px;
  }
  .goldRow b{
    font-size: clamp(20px,6vw,26px);
    color: #a87400;
    font-weight: 900;
  }

  .newbest{
    font-size:13px; font-weight:900; letter-spacing:.6px;
    color:#8a5a00;
    background: linear-gradient(180deg,#ffe680,#ffcf40);
    padding:8px 18px; border-radius:999px;
    box-shadow: 0 4px 0 #c99a12;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  .newbest.hidden{ display:none; }
  @keyframes pulse{ from{transform:scale(1);} to{transform:scale(1.06);} }

  .btnRow{ display:flex; flex-direction:column; gap:9px; width:100%; align-items:center; }

  @media (max-height: 620px){
    .card{ padding: 16px 18px 14px; gap:9px; }
    .title{ font-size: clamp(28px, 8vw, 46px); }
    .btn{ padding: 13px 34px; }
    #ready{ padding-top: 16vh; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ================= HOME SCREEN ================= -->
<div class="overlay" id="menu">
  <div class="title">FLOPPY <span>BIRD</span></div>
  <div class="sub">Pipes ke beech se udao! 🐤</div>
  <button class="btn" id="playBtn">▶ PLAY</button>
  <div class="bestLine">Highest Score: <b id="bestMenu">0</b></div>
  <div class="hint">Tap / Click / SPACE se udao</div>
</div>

<!-- ================= MODE SELECT ================= -->
<div class="overlay hidden" id="modeSelect">
  <div class="title" style="font-size:clamp(26px,6.5vw,42px)">SELECT MODE</div>
  <div class="sub" style="font-size:clamp(12px,3.2vw,14px)">Pipes ki doori badalti hai</div>
  <button class="btn modeBtn" data-mode="easy">🌿 EASY</button>
  <button class="btn modeBtn" data-mode="medium">⚡ MEDIUM</button>
  <button class="btn modeBtn" data-mode="hard">🔥 HARD</button>
  <button class="btn ghost" id="modeBackBtn">← BACK</button>
</div>

<!-- ================= TAP TO PLAY ================= -->
<div class="overlay hidden" id="ready">
  <div class="tapText">TAP TO PLAY</div>
  <div class="readySub" id="readySub">EASY MODE</div>
</div>

<!-- ================= GAME OVER ================= -->
<div class="overlay hidden" id="over">
  <div class="card">
    <h2>GAME OVER</h2>
    <div class="scores">
      <div class="scoreBox">
        <span>Score</span>
        <b id="finalScore">0</b>
      </div>
      <div class="scoreBox gold">
        <span>Highest</span>
        <b id="finalBest">0</b>
      </div>
    </div>
    <div class="goldRow">
      <span>⭐ Golden Pipes Cleared</span>
      <b id="finalGolden">0</b>
    </div>
    <div class="newbest hidden" id="newBest">🏆 NEW HIGH SCORE!</div>
    <div class="btnRow">
      <button class="btn" id="newGameBtn">NEW GAME</button>
      <button class="btn orange" id="changeModeBtn">CHANGE MODE</button>
      <button class="btn ghost" id="homeBtn">🏠 HOME</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   FLOPPY BIRD
   game state   : mode = 'menu' | 'ready' | 'play' | 'over'
   difficulty   : difficulty = 'easy' | 'medium' | 'hard'
   ========================================================= */

const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

/* ---------- DOM ---------- */
const menuEl      = document.getElementById('menu');
const modeSelEl   = document.getElementById('modeSelect');
const readyEl     = document.getElementById('ready');
const overEl      = document.getElementById('over');
const bestMenuEl  = document.getElementById('bestMenu');
const finalScoreEl= document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const finalGoldenEl = document.getElementById('finalGolden');
const newBestEl   = document.getElementById('newBest');
const readySubEl  = document.getElementById('readySub');

/* ---------- Global dims ---------- */
let W = 0, H = 0, k = 1;
let groundY = 0, groundH = 0;

/* ---------- Game state ---------- */
let mode = 'menu';
let difficulty = 'easy';
let score = 0;
let goldenCleared = 0;
let best  = Number(localStorage.getItem('floppyBirdBest') || 0);
let newBestFlag = false;

const bird = { x: 0, y: 0, vy: 0, r: 15, rot: 0, wing: 0 };

let pipes      = [];
let pipeCount  = 0;
let scroll     = 0;
let flash      = 0;
let shake      = 0;
let particles  = [];
let floaters   = [];
let clouds     = [];

/* pipe distance multiplier per difficulty */
const MODE_MULT = { easy: 1.00, medium: 0.82, hard: 0.66 };

/* =========================================================
   RESIZE
   ========================================================= */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  k = Math.max(0.70, Math.min(1.45, H / 850));

  groundH = Math.max(90 * k, H * 0.13);
  groundY = H - groundH;

  bird.r = 15 * k;
  bird.x = W * 0.28;

  if (mode === 'menu' || mode === 'ready') bird.y = H * 0.45;
  if (mode === 'over' && bird.y + bird.r > groundY) bird.y = groundY - bird.r;

  if (clouds.length === 0) initClouds();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* =========================================================
   CLOUDS
   ========================================================= */
function initClouds(){
  clouds = [];
  const n = 8;
  for (let i = 0; i < n; i++){
    clouds.push({
      x: Math.random() * W,
      y: 30 + Math.random() * (groundY * 0.58),
      s: 0.55 + Math.random() * 0.85,
      sp: 0.22 + Math.random() * 0.55
    });
  }
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function resetBird(){
  bird.x = W * 0.28;
  bird.y = H * 0.45;
  bird.vy = 0;
  bird.rot = 0;
  bird.wing = 0;
}

/* PLAY → mode select screen */
function openModeSelect(){
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  readyEl.classList.add('hidden');
  modeSelEl.classList.remove('hidden');
}

/* mode select → ready screen */
function startGame(diff){
  if (diff) difficulty = diff;

  mode = 'ready';
  score = 0;
  goldenCleared = 0;
  pipes = [];
  pipeCount = 0;
  particles = [];
  floaters = [];
  flash = 0;
  shake = 0;
  newBestFlag = false;

  resetBird();

  readySubEl.textContent = difficulty.toUpperCase() + ' MODE';

  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  modeSelEl.classList.add('hidden');
  readyEl.classList.remove('hidden');
}

/* TAP TO PLAY → actual game */
function beginPlay(){
  if (mode !== 'ready') return;
  mode = 'play';
  readyEl.classList.add('hidden');

  bird.vy = -8.6 * k;
  bird.wing = 0;
  burst(bird.x - bird.r * 0.9, bird.y + bird.r * 0.4, 4, 'rgba(255,255,255,.9)');

  spawnPipe();
}

function goHome(){
  mode = 'menu';
  pipes = [];
  particles = [];
  floaters = [];
  score = 0;
  goldenCleared = 0;
  flash = 0;
  shake = 0;
  resetBird();
  bestMenuEl.textContent = best;
  overEl.classList.add('hidden');
  readyEl.classList.add('hidden');
  modeSelEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
}

function die(){
  if (mode !== 'play') return;
  mode = 'over';
  shake = 14;
  flash = Math.max(flash, 0.35);
  burst(bird.x, bird.y, 14, '#ffd166');

  if (score > best){
    best = score;
    localStorage.setItem('floppyBirdBest', best);
    newBestFlag = true;
  } else {
    newBestFlag = false;
  }

  setTimeout(() => {
    if (mode === 'over') showGameOver();
  }, 560);
}

function showGameOver(){
  finalScoreEl.textContent  = score;
  finalBestEl.textContent   = best;
  finalGoldenEl.textContent = goldenCleared;
  bestMenuEl.textContent    = best;
  newBestEl.classList.toggle('hidden', !newBestFlag);
  overEl.classList.remove('hidden');
}

/* =========================================================
   PIPES
   ========================================================= */
function spawnPipe(){
  pipeCount++;

  // Har 10-ve pipe pe GOLDEN pipe ✨
  const gold = (pipeCount % 10 === 0);

  const shrink = Math.min(score, 25) * 1.2;
  const gap    = (172 - shrink) * k;

  const minCY = gap / 2 + 74 * k;
  const maxCY = groundY - gap / 2 - 74 * k;
  let cy;
  if (maxCY > minCY) cy = minCY + Math.random() * (maxCY - minCY);
  else               cy = (minCY + maxCY) / 2;

  pipes.push({
    x: W + 60 * k,
    w: 66 * k,
    gap,
    cy,
    gold,
    passed: false,
    tw: Math.random() * 6.28
  });
}

function pipeRects(p){
  const capH   = 26 * k;
  const capOv  = 8  * k;
  const capX   = p.x - capOv;
  const capW   = p.w + capOv * 2;
  const topEnd = p.cy - p.gap / 2;
  const botSt  = p.cy + p.gap / 2;

  return {
    capH, capX, capW, topEnd, botSt,
    list: [
      { x: p.x,  y: -400,               w: p.w,  h: (topEnd - capH) + 400 },
      { x: capX, y: topEnd - capH,      w: capW, h: capH },
      { x: capX, y: botSt,              w: capW, h: capH },
      { x: p.x,  y: botSt + capH,       w: p.w,  h: groundY - (botSt + capH) + 4 }
    ]
  };
}

function circleRect(cx, cy, r, rc){
  const nx = Math.max(rc.x, Math.min(cx, rc.x + rc.w));
  const ny = Math.max(rc.y, Math.min(cy, rc.y + rc.h));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function hitTest(p){
  const r = bird.r * 0.86;
  const { list } = pipeRects(p);
  for (const rc of list) if (circleRect(bird.x, bird.y, r, rc)) return true;
  return false;
}

/* =========================================================
   PARTICLES / FLOATERS
   ========================================================= */
function burst(x, y, n, color){
  for (let i = 0; i < n; i++){
    const a  = Math.random() * Math.PI * 2;
    const sp = (1 + Math.random() * 3.2) * k;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.2 * k,
      life: 1,
      color,
      size: (2 + Math.random() * 3) * k
    });
  }
}

function addFloater(text, x, y, color){
  floaters.push({ text, x, y, color, life: 1 });
}

/* =========================================================
   INPUT
   ========================================================= */
function flap(){
  if (mode !== 'play') return;
  bird.vy = -8.6 * k;
  bird.wing = 0;
  burst(bird.x - bird.r * 0.9, bird.y + bird.r * 0.4, 3, 'rgba(255,255,255,.9)');
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (mode === 'play')      flap();
  else if (mode === 'ready') beginPlay();
}, { passive:false });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    e.preventDefault();
    if      (mode === 'play')  flap();
    else if (mode === 'ready') beginPlay();
    else if (mode === 'menu')  openModeSelect();
    else if (mode === 'over')  startGame(difficulty);
  }
});

/* buttons */
document.getElementById('playBtn').addEventListener('click', openModeSelect);
document.getElementById('modeBackBtn').addEventListener('click', goHome);
document.getElementById('newGameBtn').addEventListener('click', () => startGame(difficulty));
document.getElementById('changeModeBtn').addEventListener('click', openModeSelect);
document.getElementById('homeBtn').addEventListener('click', goHome);

/* mode buttons */
document.querySelectorAll('.modeBtn[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.mode));
});

/* mobile safe */
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive:false });
document.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
  const speed      = 3.05 * k;
  const worldSpeed = (mode === 'play')  ? speed
                   : (mode === 'ready') ? speed * 0.55
                   : speed * 0.40;

  scroll += worldSpeed * dt;

  for (const c of clouds){
    c.x -= worldSpeed * c.sp * dt;
    if (c.x < -170 * c.s){
      c.x  = W + 90 + Math.random() * 220;
      c.y  = 30 + Math.random() * (groundY * 0.58);
      c.s  = 0.55 + Math.random() * 0.85;
      c.sp = 0.22 + Math.random() * 0.55;
    }
  }

  if (mode === 'menu' || mode === 'ready'){
    const t = performance.now();
    bird.wing += dt * 0.22;
    bird.y    = H * 0.45 + Math.sin(t / 480) * 10 * k;
    bird.rot  = Math.sin(t / 480) * 0.08;
  }

  else if (mode === 'play'){
    bird.vy += 0.52 * k * dt;
    if (bird.vy > 15 * k) bird.vy = 15 * k;
    bird.y += bird.vy * dt;
    bird.wing += dt * (bird.vy < 0 ? 1.15 : 0.22);

    const tv = Math.max(-1, Math.min(1, bird.vy / (10 * k)));
    bird.rot = tv > 0 ? tv * 1.25 : tv * 0.55;

    if (bird.y - bird.r < 0){ bird.y = bird.r; bird.vy = 0; }
    if (bird.y + bird.r >= groundY){ bird.y = groundY - bird.r; die(); }

    /* PIPE SPAWN — difficulty ke hisaab se doori */
    const baseSpacing = Math.max(W * 0.50, 240 * k);
    const spacing     = baseSpacing * MODE_MULT[difficulty];
    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - spacing) spawnPipe();

    for (const p of pipes) p.x -= speed * dt;
    pipes = pipes.filter(p => p.x + p.w + 80 * k > 0);

    if (mode === 'play'){
      for (const p of pipes){
        if (!p.passed && p.x + p.w < bird.x - bird.r){
          p.passed = true;
          score += 1;                       // golden bhi normal +1 (no extra points)
          if (p.gold){
            goldenCleared++;                // sirf counter badhta hai
            flash = 0.75;
            addFloater('⭐', bird.x + 10 * k, bird.y - 30 * k, '#ffd83d');
            burst(p.x + p.w / 2, p.cy, 22, '#ffe066');
          }
        }
        if (hitTest(p)){ die(); break; }
      }
    }
  }

  else if (mode === 'over'){
    bird.vy += 0.75 * k * dt;
    if (bird.vy > 17 * k) bird.vy = 17 * k;
    bird.y += bird.vy * dt;
    bird.rot = Math.min(1.57, bird.rot + 0.07 * dt);
    if (bird.y + bird.r > groundY){
      bird.y = groundY - bird.r;
      bird.vy = 0;
    }
  }

  for (const p of particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.2 * k * dt;
    p.vx *= 0.99;
    p.life -= 0.022 * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const f of floaters){
    f.y -= 1.4 * k * dt;
    f.life -= 0.016 * dt;
  }
  floaters = floaters.filter(f => f.life > 0);

  if (flash > 0) flash = Math.max(0, flash - 0.035 * dt);
  if (shake > 0) shake = Math.max(0, shake - 0.7 * dt);
}

/* =========================================================
   DRAW HELPERS
   ========================================================= */
function roundRect(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0,    '#4fb8e8');
  g.addColorStop(0.5,  '#93ddf5');
  g.addColorStop(1,    '#e2f7ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun(){
  const sx = W * 0.80, sy = H * 0.14, r = 46 * k;
  const glow = ctx.createRadialGradient(sx, sy, r * 0.4, sx, sy, r * 3.4);
  glow.addColorStop(0,   'rgba(255,245,180,.85)');
  glow.addColorStop(0.4, 'rgba(255,240,150,.28)');
  glow.addColorStop(1,   'rgba(255,240,150,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, r * 3.4, 0, 7); ctx.fill();

  ctx.fillStyle = '#fff7c9';
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,236,140,.95)';
  ctx.beginPath(); ctx.arc(sx, sy, r * 0.82, 0, 7); ctx.fill();
}

function drawCloud(x, y, s, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x,          y,          18 * s, 0, 7);
  ctx.arc(x + 22 * s, y - 10 * s, 23 * s, 0, 7);
  ctx.arc(x + 50 * s, y - 2 * s,  17 * s, 0, 7);
  ctx.rect(x - 18 * s, y, 68 * s, 19 * s);
  ctx.fill();
  ctx.restore();
}

function drawClouds(){
  for (const c of clouds) drawCloud(c.x, c.y, c.s, 0.55 + c.s * 0.32);
}

function drawHills(offset, baseY, radius, spacing, color){
  const off = ((offset % spacing) + spacing) % spacing;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let x = -off - spacing; x < W + spacing * 2; x += spacing){
    ctx.moveTo(x - radius, baseY);
    ctx.arc(x, baseY, radius, Math.PI, Math.PI * 2);
  }
  ctx.fill();
  ctx.fillRect(0, baseY, W, H - baseY);
}

function pipeFill(x, w, gold){
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  if (gold){
    g.addColorStop(0.00, '#b8790a');
    g.addColorStop(0.22, '#f5b71c');
    g.addColorStop(0.42, '#ffe066');
    g.addColorStop(0.58, '#fff9c9');
    g.addColorStop(0.78, '#ffcf3d');
    g.addColorStop(1.00, '#a86c05');
  } else {
    g.addColorStop(0.00, '#3d8a23');
    g.addColorStop(0.22, '#66c73f');
    g.addColorStop(0.42, '#9ee879');
    g.addColorStop(0.58, '#b6f396');
    g.addColorStop(0.78, '#6bcc45');
    g.addColorStop(1.00, '#33761c');
  }
  return g;
}

function drawStar(cx, cy, r, color){
  if (r <= 0.3) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx, cy, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy + r);
  ctx.quadraticCurveTo(cx, cy, cx - r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy - r);
  ctx.fill();
}

function drawPipe(p){
  const { capH, capX, capW, topEnd, botSt } = pipeRects(p);
  const strokeCol = p.gold ? 'rgba(120,78,0,.55)' : 'rgba(22,68,10,.55)';
  const lw = Math.max(1.6, 2.2 * k);

  ctx.fillStyle = pipeFill(p.x, p.w, p.gold);
  ctx.fillRect(p.x, -20, p.w, topEnd - capH + 20);

  ctx.fillStyle = pipeFill(capX, capW, p.gold);
  roundRect(capX, topEnd - capH, capW, capH, 5 * k);
  ctx.fill();
  ctx.strokeStyle = strokeCol;
  ctx.lineWidth = lw;
  ctx.stroke();

  ctx.fillStyle = pipeFill(capX, capW, p.gold);
  roundRect(capX, botSt, capW, capH, 5 * k);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = pipeFill(p.x, p.w, p.gold);
  ctx.fillRect(p.x, botSt + capH, p.w, groundY - (botSt + capH) + 6);

  ctx.strokeStyle = strokeCol;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(p.x, -20);               ctx.lineTo(p.x, topEnd - capH);
  ctx.moveTo(p.x + p.w, -20);         ctx.lineTo(p.x + p.w, topEnd - capH);
  ctx.moveTo(p.x, botSt + capH);      ctx.lineTo(p.x, groundY);
  ctx.moveTo(p.x + p.w, botSt + capH);ctx.lineTo(p.x + p.w, groundY);
  ctx.stroke();

  if (p.gold){
    const t = performance.now() / 300;
    const spots = [
      [p.x + p.w * 0.5, topEnd - capH * 0.5],
      [p.x + p.w * 0.5, botSt + capH * 0.5],
      [p.x + p.w * 0.5, Math.max(30 * k, topEnd - capH - 55 * k)],
      [p.x + p.w * 0.5, Math.min(groundY - 20 * k, botSt + capH + 55 * k)]
    ];
    for (let i = 0; i < spots.length; i++){
      const sz = (3 + Math.sin(t + p.tw + i * 1.7) * 2.2) * k;
      drawStar(spots[i][0], spots[i][1], sz, 'rgba(255,255,225,.95)');
    }
    ctx.save();
    ctx.globalAlpha = 0.16 + Math.sin(t * 1.3 + p.tw) * 0.07;
    ctx.fillStyle = '#ffe57a';
    ctx.fillRect(p.x - 4 * k, -20, p.w + 8 * k, topEnd - capH + 20);
    ctx.fillRect(p.x - 4 * k, botSt + capH, p.w + 8 * k, groundY - botSt);
    ctx.restore();
  }
}

function drawPipes(){
  for (const p of pipes) drawPipe(p);
}

function drawGround(){
  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, '#e6d49a');
  g.addColorStop(1, '#c9b073');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, groundH);

  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, groundY, W, 13 * k);
  ctx.fillStyle = '#63b23a';
  ctx.fillRect(0, groundY + 13 * k, W, 4 * k);
  ctx.fillStyle = '#a5e072';
  ctx.fillRect(0, groundY, W, 3 * k);

  const s = 46 * k;
  const off = scroll % s;
  ctx.fillStyle = 'rgba(178,152,96,.55)';
  for (let x = -off - s; x < W + s; x += s){
    ctx.fillRect(x,             groundY + 32 * k, s * 0.46, 6 * k);
    ctx.fillRect(x + s * 0.58,  groundY + 56 * k, s * 0.30, 5 * k);
    ctx.fillRect(x + s * 0.20,  groundY + 74 * k, s * 0.24, 4 * k);
  }
}

function drawBird(){
  const r = bird.r;
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  if (mode === 'ready'){
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 1400);
    const gr = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.6);
    gr.addColorStop(0, `rgba(255,255,220,${0.22 + pulse * 0.18})`);
    gr.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.6, 0, 7); ctx.fill();
  }

  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.15, 0, 0, r * 1.35);
  g.addColorStop(0,   '#fff2a0');
  g.addColorStop(0.55,'#ffd83d');
  g.addColorStop(1,   '#e8a005');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.16, r, 0, 0, 7);
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,88,0,.55)';
  ctx.lineWidth = Math.max(1.4, r * 0.13);
  ctx.stroke();

  const wy = Math.sin(bird.wing) * r * 0.42;
  const wr = Math.sin(bird.wing) * 0.45;
  ctx.fillStyle = '#fff8cc';
  ctx.beginPath();
  ctx.ellipse(-r * 0.18, wy, r * 0.62, r * 0.40, wr, 0, 7);
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,100,0,.40)';
  ctx.lineWidth = Math.max(1, r * 0.09);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(r * 0.48, -r * 0.33, r * 0.35, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(140,88,0,.35)';
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.stroke();

  ctx.fillStyle = '#22262b';
  ctx.beginPath(); ctx.arc(r * 0.56, -r * 0.33, r * 0.17, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(r * 0.62, -r * 0.40, r * 0.06, 0, 7); ctx.fill();

  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(r * 1.00, -r * 0.02);
  ctx.lineTo(r * 1.72,  r * 0.20);
  ctx.lineTo(r * 1.00,  r * 0.44);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,70,0,.5)';
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.stroke();

  ctx.restore();
}

function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floaters){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = `900 ${Math.round(24 * k)}px system-ui, sans-serif`;
    ctx.lineWidth = 5 * k;
    ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawScore(){
  if (mode !== 'play' && mode !== 'over') return;

  /* center score */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  const size = Math.round(54 * k);
  ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = 8 * k;
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.strokeText(String(score), W / 2, 34 * k);
  const g = ctx.createLinearGradient(0, 34 * k, 0, 34 * k + size);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#d8f3ff');
  ctx.fillStyle = g;
  ctx.fillText(String(score), W / 2, 34 * k);

  /* top-left: BEST + mode label */
  ctx.textAlign = 'left';
  ctx.font = `800 ${Math.round(15 * k)}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.88)';
  ctx.fillText('BEST ' + best, 18 * k, 20 * k);

  ctx.font = `800 ${Math.round(11 * k)}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.fillText(difficulty.toUpperCase(), 18 * k, 40 * k);

  /* top-right: golden pipe counter */
  ctx.textAlign = 'right';
  ctx.font = `900 ${Math.round(18 * k)}px system-ui, sans-serif`;
  ctx.lineWidth = 4.5 * k;
  ctx.strokeStyle = 'rgba(0,0,0,.38)';
  ctx.strokeText('⭐ ' + goldenCleared, W - 18 * k, 20 * k);
  ctx.fillStyle = '#ffe066';
  ctx.fillText('⭐ ' + goldenCleared, W - 18 * k, 20 * k);

  ctx.font = `800 ${Math.round(10 * k)}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.fillText('GOLDEN', W - 18 * k, 44 * k);
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  ctx.save();

  if (shake > 0){
    const s = shake * 0.6;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  drawSky();
  drawSun();
  drawClouds();

  drawHills(scroll * 0.10, groundY - 100 * k, 135 * k, 155 * k, '#c2eab9');
  drawHills(scroll * 0.22, groundY - 58 * k,   96 * k, 112 * k, '#9cdd93');
  drawHills(scroll * 0.42, groundY - 14 * k,   58 * k,  70 * k, '#6ec96a');

  drawPipes();
  drawGround();

  drawParticles();
  drawBird();
  drawFloaters();
  drawScore();

  ctx.restore();

  if (flash > 0){
    ctx.fillStyle = `rgba(255,225,90,${flash * 0.30})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT = performance.now();
function loop(t){
  const dt = Math.min((t - lastT) / 16.667, 3);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   BOOT
   ========================================================= */
resize();
bestMenuEl.textContent = best;
resetBird();
requestAnimationFrame(loop);
</script>
</body>
